name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build project
        run: |
          if bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts && p.scripts.build ? 0 : 1)'; then
            bun run build
          else
            echo "No build script; skipping"
          fi

      - name: Run tests
        run: |
          if bun -e 'const p = await Bun.file("package.json").json(); process.exit(p.scripts && p.scripts.test ? 0 : 1)'; then
            bun run test
          else
            echo "No test script; skipping"
          fi
